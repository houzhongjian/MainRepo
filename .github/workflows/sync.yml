name: Sync Monorepo Subfolders

on:
  push:
    branches:
      - main

jobs:
  sync-ahrefs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ahrefs
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Clone RepoSEO
        env:
          TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/TestMainRepo/RepoSEO.git target-repo

      - name: Sync ahrefs folder
        run: |
          rm -rf target-repo/ahrefs
          mkdir -p target-repo/ahrefs
          cp -a ahrefs/. target-repo/ahrefs/

      - name: Commit and push
        run: |
          cd target-repo
          git add ahrefs
          git commit -m "Sync ahrefs folder" || echo "No changes to commit"
          git push origin main