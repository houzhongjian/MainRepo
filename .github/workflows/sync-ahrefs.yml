name: Sync Monorepo Subfolders

on:
  push:
    branches:
      - main

jobs:
  sync-ahrefs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Check source ahrefs folder
        run: |
          echo "Current repo:"
          pwd
          ls -la
          echo "Source ahrefs:"
          ls -la ahrefs
          find ahrefs -maxdepth 2 -type f | head -30

      - name: Clone RepoSEO
        env:
          TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/TestMainRepo/RepoSEO.git target-repo

      - name: Sync ahrefs into RepoSEO
        run: |
          rm -rf target-repo/ahrefs
          mkdir -p target-repo/ahrefs

          cp -a ahrefs/. target-repo/ahrefs/

          echo "Target ahrefs:"
          ls -la target-repo/ahrefs
          find target-repo/ahrefs -maxdepth 2 -type f | head -30

      - name: Commit and push to RepoSEO
        run: |
          cd target-repo

          git status
          git add -A ahrefs
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync ahrefs folder"
            git push origin HEAD:main
          fi