name: Sync Monorepo Subfolders

on:
  push:
    branches:
      - main

jobs:
  sync-gpt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Check source gpt folder
        run: |
          echo "Current repo:"
          pwd
          ls -la
          echo "Source gpt:"
          ls -la gpt
          find gpt -maxdepth 2 -type f | head -30

      - name: Clone RepoSEO
        env:
          TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TOKEN}@github.com/TestMainRepo/RepoAI.git target-repo

      - name: Sync gpt into RepoSEO
        run: |
          rm -rf target-repo/gpt
          mkdir -p target-repo/gpt

          cp -a gpt/. target-repo/gpt/

          echo "Target gpt:"
          ls -la target-repo/gpt
          find target-repo/gpt -maxdepth 2 -type f | head -30

      - name: Commit and push to RepoSEO
        run: |
          cd target-repo

          git status
          git add -A gpt
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync gpt folder"
            git push origin HEAD:main
          fi